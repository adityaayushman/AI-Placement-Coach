[project]
name = "placement-coach-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "rq>=1.16,<3",
  "alembic>=1.13,<2",
  "pyjwt>=2.8,<3",
  "python-multipart>=0.0.9",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "pypdf>=4,<7",
]

[project.optional-dependencies]
# Heavier backends, used automatically when installed (see docs/DECISIONS.md).
ml-heavy = [
  "torch>=2.4",
  "sentence-transformers>=3",
  "faster-whisper>=1",
  "xgboost>=2",
  "pdfplumber>=0.11",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "sklearn.*", "scipy.*", "joblib.*", "pandas.*", "rq.*", "pypdf.*", "pdfplumber.*",
  "xgboost.*", "faster_whisper.*", "sentence_transformers.*", "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
